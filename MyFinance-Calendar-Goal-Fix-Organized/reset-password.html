<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MyFinance — Choose New Password</title>
  <link rel="stylesheet" href="assets/css/base/global.css">
  <link rel="stylesheet" href="assets/css/pages/auth.css">
  <script>document.documentElement.dataset.theme = localStorage.getItem("myfinance-theme") || "light";</script>
</head>
<body class="auth-page">
  <main class="auth-layout">
    <section class="auth-card">
      <div class="brand">
        <div class="brand-mark">₹</div>
        <h1>Choose a new password</h1>
        <p>Your password will be managed securely.</p>
      </div>

      <div id="authError" class="alert error hidden" role="alert"></div>
      <div id="authSuccess" class="alert success hidden" role="status"></div>

      <form id="resetForm" novalidate>
        <label for="password">New Password</label>
        <input id="password" type="password" autocomplete="new-password"
               placeholder="At least 8 characters" required>

        <label for="confirmPassword">Confirm Password</label>
        <input id="confirmPassword" type="password" autocomplete="new-password"
               placeholder="Re-enter your password" required>

        <button id="resetButton" class="btn btn-primary" type="submit">
          Update Password
        </button>
      </form>

      <div class="auth-footer">
        <a href="index.html">Back to Login</a>
      </div>
    </section>
  </main>

  <script type="module" src="assets/js/pages/auth.js"></script>
</body>
</html>
