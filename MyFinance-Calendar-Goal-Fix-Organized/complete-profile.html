<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#08a67a">
  <title>MyFinance — Complete Profile</title>
  <link rel="stylesheet" href="assets/css/base/global.css">
  <link rel="stylesheet" href="assets/css/pages/auth.css">
  <script>document.documentElement.dataset.theme = localStorage.getItem("myfinance-theme") || "light";</script>
</head>
<body class="auth-page">
  <div id="pageLoader" class="page-loader hidden">
    <div class="spinner"></div>
    <p>Saving your profile…</p>
  </div>

  <main class="auth-layout">
    <section class="auth-card">
      <div class="brand">
        <div class="brand-mark">₹</div>
        <h1>One last step</h1>
        <p>Add your mobile number to finish your MyFinance profile.</p>
      </div>

      <div id="profileError" class="alert error hidden" role="alert"></div>
      <div id="profileSuccess" class="alert success hidden" role="status"></div>

      <form id="completeProfileForm" novalidate>
        <label for="mobileNumber">Mobile Number</label>
        <input id="mobileNumber" type="tel" inputmode="tel"
               autocomplete="tel" placeholder="+91 98765 43210"
               maxlength="20" required>

        <button id="profileButton" class="btn btn-primary" type="submit">
          Complete Profile
        </button>
      </form>
    </section>
  </main>

  <script type="module" src="assets/js/pages/complete-profile.js"></script>
</body>
</html>
