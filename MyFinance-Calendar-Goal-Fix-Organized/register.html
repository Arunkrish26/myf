<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#08a67a">
  <title>MyFinance — Create Account</title>
  <link rel="stylesheet" href="assets/css/base/global.css">
  <link rel="stylesheet" href="assets/css/pages/auth.css">
  <script>document.documentElement.dataset.theme = localStorage.getItem("myfinance-theme") || "light";</script>
</head>
<body class="auth-page">
  <div id="pageLoader" class="page-loader hidden" aria-live="polite">
    <div class="spinner"></div>
    <p>Creating your account…</p>
  </div>

  <main class="auth-layout">
    <section class="auth-card register-card">
      <div class="brand">
        <div class="brand-mark">₹</div>
        <h1>Create your account</h1>
        <p>Start managing your money with MyFinance.</p>
      </div>

      <div id="authError" class="alert error hidden" role="alert"></div>
      <div id="authSuccess" class="alert success hidden" role="status"></div>

      <form id="registerForm" class="register-form-grid" novalidate>
        <div class="form-field">
          <label for="fullName">Full Name</label>
          <input id="fullName" type="text" autocomplete="name"
                 placeholder="Arun Krish" maxlength="100" required>
        </div>

        <div class="form-field">
          <label for="mobileNumber">Mobile Number</label>
          <input id="mobileNumber" type="tel" inputmode="tel"
                 autocomplete="tel" placeholder="+91 98765 43210"
                 maxlength="20" required>
        </div>

        <div class="form-field full-width">
          <label for="email">Email</label>
          <input id="email" type="email" autocomplete="email"
                 placeholder="you@example.com" required>
        </div>

        <div class="form-field">
          <label for="password">Password</label>
          <input id="password" type="password" autocomplete="new-password"
                 placeholder="At least 8 characters" required>
        </div>

        <div class="form-field">
          <label for="confirmPassword">Confirm Password</label>
          <input id="confirmPassword" type="password" autocomplete="new-password"
                 placeholder="Re-enter your password" required>
        </div>

        <button id="registerButton" class="btn btn-primary full-width" type="submit">
          Create Account
        </button>
      </form>

      <div class="divider"><span>or</span></div>

      <button id="googleButton" class="btn btn-google" type="button">
        <span class="google-g">G</span>
        Continue with Google
      </button>

      <div class="auth-links">
        <a href="why-50-30-20.html">Why 50/30/20?</a>
        <a href="help.html">Help</a>
      </div>

      <div class="auth-footer">
        <span>Already have an account?</span>
        <a href="index.html">Login</a>
      </div>
    </section>
  </main>

  <script type="module" src="assets/js/pages/auth.js"></script>
</body>
</html>
