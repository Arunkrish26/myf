<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MyFinance — Reset Password</title>
  <link rel="stylesheet" href="assets/css/base/global.css">
  <link rel="stylesheet" href="assets/css/pages/auth.css">
  <script>document.documentElement.dataset.theme = localStorage.getItem("myfinance-theme") || "light";</script>
</head>
<body class="auth-page">
  <main class="auth-layout">
    <section class="auth-card">
      <div class="brand">
        <div class="brand-mark">₹</div>
        <h1>Reset password</h1>
        <p>We'll send a secure password reset link to your email.</p>
      </div>

      <div id="authError" class="alert error hidden" role="alert"></div>
      <div id="authSuccess" class="alert success hidden" role="status"></div>

      <form id="forgotForm" novalidate>
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email"
               placeholder="you@example.com" required>

        <button id="forgotButton" class="btn btn-primary" type="submit">
          Send Reset Link
        </button>
      </form>

      <div class="auth-footer">
        <a href="index.html">Back to Login</a>
      </div>
    </section>
  </main>

  <script type="module" src="assets/js/pages/auth.js"></script>
</body>
</html>
